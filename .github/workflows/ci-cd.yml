name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - training_data.csv
      - train_model.py
      - test_train_model.py
      - requirements.txt
      - .github/workflows/ci-cd.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test training and exports
        run: python -m unittest -v
      - name: Train linear model
        run: python train_model.py
      - name: Save model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linear-model
          path: |
            linear_model.txt
            linear_model.pkl
          if-no-files-found: error

  publish:
    needs: train
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository for publication
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: publication
      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: linear-model
          path: model
      - name: Update release branch
        id: release_commit
        working-directory: publication
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/release; then
            git switch --track origin/release
          else
            git switch --orphan release
          fi
          cp ../model/linear_model.txt linear_model.txt
          git add linear_model.txt
          git commit --allow-empty -m "Update linear model from ${SOURCE_SHA}"
          git push origin HEAD:release
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        working-directory: publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v${RUN_NUMBER}.${RUN_ATTEMPT}"
          gh release create "$tag" \
            --target "$RELEASE_SHA" \
            --title "Release $tag" \
            --notes "Automated linear model trained from source commit ${SOURCE_SHA}." \
            ../model/linear_model.txt ../model/linear_model.pkl
